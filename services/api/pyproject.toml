[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-api"
version = "0.1.0"
description = "DocuMind document research assistant API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20,<2",
  "fastapi>=0.162,<1",
  "psycopg[binary]>=3.3,<4",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1,<3",
  "uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.2,<10",
  "ruff>=0.17,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
